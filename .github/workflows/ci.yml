name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      # The first apply runs the release before, so the second one is an
      # upgrade: Kestra migrates its H2 database as the new image starts.
      - name: Apply v2.0.8-slim, then upgrade to the default release
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve -var kestra_version=v2.0.8-slim -var image_digest=sha256:d7bb1af55f4b5730247e5c8c852e2c912ccd36a58c7846ac96d2d749295ba365
          conn3x apply -auto-approve
      - name: Plan again with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      # The admin password and the flow secret reach the host write-only, in
      # their plain form and Kestra's base64 one, so state holds neither, and
      # nothing Conn3x writes under .terraform does either. .terraform/modules
      # is left out: it holds downloaded module code.
      - name: Check the secrets stay out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          for s in Correct-horse-battery-9 hello-from-a-secret-7 aGVsbG8tZnJvbS1hLXNlY3JldC03; do
            if grep -rqF --exclude-dir=modules -e "$s" terraform.tfstate .terraform/; then
              echo "A secret from the example is in terraform.tfstate or under .terraform/." >&2
              exit 1
            fi
          done
      # Signs in as the admin, refuses a wrong password and none, saves and
      # runs a flow that fails unless its secret is the example's, and checks
      # the web server isn't on the host's bridge address.
      - name: Sign in, run a flow that reads a secret
        working-directory: examples/local
        run: sudo podman exec -i circuit-kestra sh < check.sh
      # Restarting the container boots systemd again, so this checks the
      # service is enabled and the flow and its runs live on the host.
      - name: Restart the host, then run the flow again
        working-directory: examples/local
        run: |
          sudo podman restart circuit-kestra
          for _ in $(seq 90); do
            case $(sudo podman exec circuit-kestra systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i circuit-kestra sh < check.sh
      - name: Plan again after the restart
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      - name: Check only root can enter the data's parent
        run: '[ "$(sudo podman exec circuit-kestra stat -c "%u %a" /var/lib/kestra)" = "0 700" ]'
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
